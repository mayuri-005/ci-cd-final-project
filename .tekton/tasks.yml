
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  steps:
    - name: remove-files
      image: alpine:3.20
      script: |
        #!/bin/sh
        echo "Cleaning workspace"
        rm -rf /workspace/source/temp
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: python:3.9
      workingDir: /workspace/source
      script: |
        #!/bin/sh
        pip install -r requirements.txt
        pip install nose
        nosetests
